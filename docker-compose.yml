version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: crab-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: craboffice
      POSTGRES_USER: crab
      POSTGRES_PASSWORD: crab_secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
