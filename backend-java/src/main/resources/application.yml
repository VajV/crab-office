spring:
  application:
    name: crab-office-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/craboffice
    username: ${POSTGRES_USER:crab}
    password: ${POSTGRES_PASSWORD:crab_secret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: localhost
      port: 6379

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  openclaw:
    url: ${OPENCLAW_URL:http://localhost:18789/v1/chat/completions}
    token: ${OPENCLAW_GATEWAY_TOKEN:crab-office-dev-token-change-me}
    model: ${OPENCLAW_MODEL:openclaw}

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
